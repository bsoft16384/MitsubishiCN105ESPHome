substitutions:
  name: "esp32-hp-test"
  friendly_name: Clim Sejour

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:    
  level: DEBUG


api:
  encryption:
    key: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="

ota:  
  - platform: esphome
    password: "dummy_ota_password"

wifi:
  ssid: "dummy_ssid"
  password: "dummy_password"

external_components:
 - source:
     type: local
     path: ../components 

sensor:
  - platform: template
    name: "dg_uart_connected"
    entity_category: DIAGNOSTIC
    lambda: |-
      return (bool) id(esp32_clim).is_uart_ready();
    update_interval: 30s

  - platform: template
    name: "dg_hp_connected"
    entity_category: DIAGNOSTIC
    lambda: |-
      return (bool) id(esp32_clim).is_uart_ready();
    update_interval: 30s

  - platform: template
    name: "dg_complete_cycles"
    entity_category: DIAGNOSTIC
    accuracy_decimals: 0
    lambda: |-
      return (unsigned long) id(esp32_clim).nbCompleteCycles_;
    update_interval: 60s

  - platform: template
    name: "dg_total_cycles"
    accuracy_decimals: 0
    entity_category: DIAGNOSTIC
    lambda: |-
      return (unsigned long) id(esp32_clim).nbCycles_;
    update_interval: 60s
  - platform: template
    name: "dg_nb_hp_connections"
    accuracy_decimals: 0
    entity_category: DIAGNOSTIC
    lambda: |-
      return (unsigned int) id(esp32_clim).nbHeatpumpConnections_;
    update_interval: 60s

  - platform: template
    name: "dg_complete_cycles_percent"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: DIAGNOSTIC
    lambda: |-      
      unsigned long nbCompleteCycles = id(esp32_clim).nbCompleteCycles_;
      unsigned long nbCycles = id(esp32_clim).nbCycles_;
      if (nbCycles == 0) {
        return 0.0;
      }
      return (float) nbCompleteCycles / nbCycles * 100.0;
    update_interval: 60s

  - platform: homeassistant
    id: ha_cdeg_sejour_et_cuisine
    entity_id: sensor.cdeg_sejour_et_cuisine
    internal: true

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: GPIO17
  rx_pin: GPIO16

climate:
  - platform: cn105  
    name: ${friendly_name}
    id: "esp32_clim"
    compressor_frequency_sensor:
      name: Compressor frequency (clim Sejour)    
    vertical_vane_select:
      name: Orientation de la Vane Verticale
    horizontal_vane_select:
      name: Orientation de la Vane Horizontale
    isee_sensor:
      name: ISEE Sensor
    auto_sub_mode_sensor:
      name: auto-submode sensor
    sub_mode_sensor:
      name: submode sensor
    stage_sensor:
      name: stage sensor      
    remote_temperature_timeout: 15min
    update_interval: 2500ms         # shouldn't be less than 1 second
    debounce_delay : 120ms       # delay to prevent bouncing 
    hp_uptime_connection_sensor:
      name: ${name} HP Uptime Connection
      update_interval: 30s
    
    # Built-in remote temperature source (replaces manual lambdas)
    remote_temperature_source:
      sensor_id: ha_cdeg_sejour_et_cuisine

    # Extra options (commented out by default, showcasing available features)
    # air_purifier_switch:
    #   name: "Air Purifier clim Sejour"
    # night_mode_switch:
    #   name: "Night Mode clim Sejour"
    # circulator_switch:
    #   name: "Circulator clim Sejour"
    # functions_get_button:
    #   name: "Get Functions clim Sejour"
    # hardware_settings:
    #   update_interval: 24h
    #   list:
    #     - code: 101
    #       id: hardware_setting_101
    #       options:
    #         1: "Option A"
    #         2: "Option B"
    #         3: "Option C"

    supports:
      mode: [COOL, HEAT, FAN_ONLY, DRY]
      fan_mode: [AUTO, QUIET, LOW, MEDIUM, HIGH]
      swing_mode: ["OFF", VERTICAL]
    visual:
      min_temperature: 17
      max_temperature: 23
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1



